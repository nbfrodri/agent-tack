<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tack documentation</title>
<style>
:root {
  --bg: #ffffff; --bg-soft: #f6f7f9; --bg-code: #f1f3f5; --text: #1c2024; --muted: #60656c;
  --line: #e2e5e9; --accent: #0d7c72; --accent-soft: #e3f4f1; --mark: #fff3c4;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  /* Real font names before generic or foreign ones: on some Linux desktops system-ui, sans-serif
     and substitutes for missing fonts such as Segoe UI resolve to a monospace font. */
  --sans: -apple-system, BlinkMacSystemFont, "Noto Sans", "Liberation Sans", "DejaVu Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --bg-soft: #181b1e; --bg-code: #1e2226; --text: #e6e8ea; --muted: #9aa1a8;
    --line: #2a2f34; --accent: #4fd1c1; --accent-soft: #15302d; --mark: #4a3f12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --bg-soft: #181b1e; --bg-code: #1e2226; --text: #e6e8ea; --muted: #9aa1a8;
  --line: #2a2f34; --accent: #4fd1c1; --accent-soft: #15302d; --mark: #4a3f12; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: var(--mono); font-size: 0.88em; }
code { background: var(--bg-code); padding: 0.1em 0.35em; border-radius: 4px; }
pre { background: var(--bg-code); padding: 14px 16px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: 1em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 18px; color: var(--text); white-space: nowrap; }
.brand span { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 6px; }
.search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
.search input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg-soft); color: var(--text); font: inherit; font-size: 14px; }
.results { position: absolute; top: 42px; left: 0; right: 0; max-height: 60vh; overflow-y: auto; margin: 0;
  padding: 6px; list-style: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
.results[hidden] { display: none; }
.results a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--text); }
.results a:hover, .results a.current { background: var(--accent-soft); text-decoration: none; }
.results small { color: var(--muted); margin-left: 8px; }
.icon-button { height: 36px; min-width: 36px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg-soft); color: var(--text); font: inherit; cursor: pointer; }
#menu { display: none; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); }
nav { position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; padding: 20px 12px 40px;
  border-right: 1px solid var(--line); background: var(--bg-soft); }
.nav-group { margin-bottom: 18px; }
.nav-title { margin: 0 0 4px 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--muted); }
nav ul { list-style: none; margin: 0; padding: 0; }
nav a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--text); font-size: 14px; }
nav a:hover { background: var(--bg-code); text-decoration: none; }
nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

main { min-width: 0; padding: 32px 48px 80px; }
.page { max-width: 860px; }
.page[hidden] { display: none; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 12px; }
h2 { font-size: 1.35rem; margin: 2.2em 0 0.6em; padding-top: 0.4em; border-top: 1px solid var(--line); }
h3 { font-size: 1.1rem; margin: 1.6em 0 0.5em; }
.lead { font-size: 1.1rem; color: var(--muted); }
.muted, .meta { color: var(--muted); }
.meta { font-size: 14px; margin: 6px 0; }
blockquote { margin: 1em 0; padding: 4px 16px; border-left: 3px solid var(--accent); background: var(--bg-soft); border-radius: 0 6px 6px 0; }
.table { overflow-x: auto; margin: 1em 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { background: var(--bg-soft); font-weight: 600; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px 12px; margin: 16px 0; }
.card h3 { margin: 12px 0 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.card h3 a { color: var(--text); }
.tag { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.items { padding-left: 18px; }
.items li { margin: 6px 0; }
.kind { display: inline-block; min-width: 46px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.command-entry { padding: 10px 0; border-bottom: 1px solid var(--line); }
.command-entry p { margin: 4px 0 0 4px; color: var(--muted); }
code.command { font-size: 0.95em; font-weight: 600; color: var(--text); }
.overview li { margin: 8px 0; }
.source { margin-top: 3em; font-size: 14px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 16px; max-width: 860px; margin-top: 48px;
  padding-top: 16px; border-top: 1px solid var(--line); }
.pager a { display: block; max-width: 48%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; }
.pager small { display: block; color: var(--muted); }
.pager .next { margin-left: auto; text-align: right; }
mark { background: var(--mark); color: inherit; }

@media (max-width: 860px) {
  #menu { display: inline-block; }
  .brand span { display: none; }
  .layout { grid-template-columns: 1fr; }
  nav { position: fixed; top: 56px; left: 0; z-index: 15; width: min(300px, 85vw); transform: translateX(-100%);
    transition: transform 0.2s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  body.menu-open nav { transform: none; }
  main { padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) { nav { transition: none; } }
</style>
</head>
<body>
<header>
  <button id="menu" class="icon-button" type="button" aria-label="Open the index" aria-expanded="false">☰</button>
  <a class="brand" href="#manual-start">tack<span>docs {{version}}</span></a>
  <div class="search" role="search">
    <input id="search" type="search" placeholder="Search commands, sets, skills…  ( / )" aria-label="Search the documentation" autocomplete="off">
    <ul id="results" class="results" hidden></ul>
  </div>
  <button id="theme" class="icon-button" type="button" aria-label="Switch light or dark theme">◐</button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Documentation index">{{nav}}</nav>
  <main id="main">
{{content}}
    <div class="pager" id="pager"></div>
  </main>
</div>
<script type="application/json" id="search-index">{{index}}</script>
<script>
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll('main .page'));
  var links = Array.prototype.slice.call(document.querySelectorAll('nav a'));
  var pager = document.getElementById('pager');
  var index = JSON.parse(document.getElementById('search-index').textContent);

  function show(hash) {
    var target = hash && document.getElementById(decodeURIComponent(hash.slice(1)));
    var page = target && target.closest('.page') || pages[0];
    pages.forEach(function (p) { p.hidden = p !== page; });
    var position = -1;
    links.forEach(function (link, i) {
      var active = link.getAttribute('href') === '#' + page.id;
      link.classList.toggle('active', active);
      if (active) position = i;
    });
    // Scroll the index and the window separately: scrollIntoView would move both.
    var nav = document.getElementById('nav'), activeLink = links[position];
    if (activeLink && (activeLink.offsetTop < nav.scrollTop || activeLink.offsetTop > nav.scrollTop + nav.clientHeight - 40)) {
      nav.scrollTop = activeLink.offsetTop - nav.clientHeight / 3;
    }
    var previous = links[position - 1], next = links[position + 1];
    pager.innerHTML = '';
    [[previous, 'prev', 'Previous'], [next, 'next', 'Next']].forEach(function (entry) {
      if (!entry[0]) return;
      var a = document.createElement('a');
      a.href = entry[0].getAttribute('href');
      a.className = entry[1];
      var label = document.createElement('small');
      label.textContent = entry[2];
      a.appendChild(label);
      a.appendChild(document.createTextNode(entry[0].textContent));
      pager.appendChild(a);
    });
    document.title = page.dataset.title + ' · tack documentation';
    var top = target && target !== page ? target.getBoundingClientRect().top + window.pageYOffset - 72 : 0;
    window.scrollTo(0, Math.max(0, top));
    document.body.classList.remove('menu-open');
    menu.setAttribute('aria-expanded', 'false');
  }

  // Menu on narrow screens.
  var menu = document.getElementById('menu');
  menu.addEventListener('click', function () {
    var open = document.body.classList.toggle('menu-open');
    menu.setAttribute('aria-expanded', String(open));
  });

  // Theme: follows the system unless the reader picks one.
  var root = document.documentElement;
  try { var saved = localStorage.getItem('tack-docs-theme'); if (saved) root.dataset.theme = saved; } catch (e) {}
  document.getElementById('theme').addEventListener('click', function () {
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('tack-docs-theme', root.dataset.theme); } catch (e) {}
  });

  // Search over titles and descriptions.
  var input = document.getElementById('search');
  var results = document.getElementById('results');
  var current = 0;
  function render() {
    var terms = input.value.toLowerCase().split(/\s+/).filter(Boolean);
    results.innerHTML = '';
    current = 0;
    if (!terms.length) { results.hidden = true; return; }
    var found = index.map(function (entry) {
      var title = entry.title.toLowerCase(), text = (entry.title + ' ' + entry.text).toLowerCase();
      if (!terms.every(function (t) { return text.indexOf(t) !== -1; })) return null;
      var score = terms.reduce(function (s, t) { return s + (title.indexOf(t) === 0 ? 3 : title.indexOf(t) !== -1 ? 2 : 0); }, 0);
      return { entry: entry, score: score };
    }).filter(Boolean).sort(function (a, b) { return b.score - a.score; }).slice(0, 25);
    // Ids are plain anchors; anything else in the index is never turned into a link.
    found = found.filter(function (hit) { return /^[a-z0-9_-]+$/i.test(hit.entry.id); });
    found.forEach(function (hit, i) {
      var li = document.createElement('li'), a = document.createElement('a'), group = document.createElement('small');
      a.setAttribute('href', '#' + encodeURIComponent(hit.entry.id));
      a.textContent = hit.entry.title;
      group.textContent = hit.entry.group;
      a.appendChild(group);
      if (i === 0) a.classList.add('current');
      li.appendChild(a);
      results.appendChild(li);
    });
    if (!found.length) {
      var empty = document.createElement('li');
      empty.className = 'muted';
      empty.style.padding = '6px 10px';
      empty.textContent = 'No matches';
      results.appendChild(empty);
    }
    results.hidden = false;
  }
  function move(step) {
    var items = results.querySelectorAll('a');
    if (!items.length) return;
    items[current].classList.remove('current');
    current = (current + step + items.length) % items.length;
    items[current].classList.add('current');
    items[current].scrollIntoView({ block: 'nearest' });
  }
  input.addEventListener('input', render);
  input.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowDown') { event.preventDefault(); move(1); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); move(-1); }
    else if (event.key === 'Enter') {
      var chosen = results.querySelectorAll('a')[current];
      if (chosen) { location.hash = chosen.getAttribute('href'); input.value = ''; render(); input.blur(); }
    } else if (event.key === 'Escape') { input.value = ''; render(); input.blur(); }
  });
  results.addEventListener('click', function () { input.value = ''; render(); });
  document.addEventListener('keydown', function (event) {
    if (event.key === '/' && document.activeElement !== input) { event.preventDefault(); input.focus(); }
  });

  window.addEventListener('hashchange', function () { show(location.hash); });
  show(location.hash);
})();
</script>
</body>
</html>
