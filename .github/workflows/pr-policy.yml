name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check title and review information
        run: python3 skills/github-issues/assets/check-pr.py
