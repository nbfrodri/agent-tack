name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh tests/*.sh
      - name: Validate skills, agents and plugins.txt
        run: tests/validate.sh

  install:
    # macOS ships bash 3.2, so this also guards against newer bash-only syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test install.sh in throwaway HOME directories
        run: tests/install.test.sh
