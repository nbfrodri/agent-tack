name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository, so the token only reads it.
permissions:
  contents: read

# A new push to a pull request cancels its older run; every push to main gets its own group, so
# each commit on main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The ShellCheck developers use (docs/development.md); the runner's own is older and differs.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  # The guard runs before every shell command; tests/guard.test.sh fails above this average.
  TACK_GUARD_BUDGET_MS: "500"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned ShellCheck
        run: |
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version
      - name: Install the pinned ruff
        run: pipx install ruff==0.14.0
      - name: Lint shell and Python (tests/lint.sh, the same command as AGENTS.md)
        run: tests/lint.sh
      - name: Validate skills, agents, cross-references and plugins.txt
        run: tests/validate.sh
      - name: Test the validator
        run: tests/validate.test.sh

  install:
    # macOS ships bash 3.2, so this also guards against newer bash-only syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shells for completion syntax checks
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh fish
      - name: Test install.sh in throwaway HOME directories
        run: tests/install.test.sh
      - name: Test git and Claude Code hooks
        run: tests/hooks.test.sh
      - name: Test audit regressions and startup context offline
        run: |
          tests/completion.test.sh
          tests/usage.test.sh
          tests/codex-used.test.sh
          tests/branches.test.sh
          tests/update.test.sh
          tests/cross-delegate.test.sh
          tests/lifecycle.test.sh
          tests/doctor.test.sh
          tests/tools.test.sh
          tests/mods.test.sh
          tests/vscode.test.sh
          tests/codex.test.sh
          tests/cli.test.sh
          tests/settings.test.sh
          tests/safety.test.sh
          tests/guard.test.sh
          tests/project-capabilities.test.sh
          tests/native-agents.test.sh
          tests/project-setup.test.sh
          tests/verification.test.sh
          tests/project-config.test.sh
          tests/team.test.sh
          tests/sets.test.sh
          tests/pr-policy.test.sh
          tests/ownership-platform.test.sh
          tests/smoke.test.sh
          tests/run-all.test.sh

  windows:
    # Native Windows through Git Bash is experimental (docs/editors.md#windows). This job keeps the
    # checkout, the validator, the installer, the git hooks and the guard working there; the other
    # suites need symlink and tool behaviour Windows lacks.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate skills, agents and cross-references
        run: tests/validate.sh
      - name: Validate native ownership paths, ACLs and restoration
        run: tests/ownership-platform.test.sh
      - name: Verify project checks with native Python and Git Bash
        run: tests/verification.test.sh
      - name: Check shared project preferences with native Python and Git Bash
        run: tests/project-config.test.sh
      - name: Check project setup and clone summaries with native Python and Git Bash
        run: python3 tests/project-setup.test.py
      - name: Check team diagnostics and PR metadata
        run: |
          tests/team.test.sh
          tests/pr-policy.test.sh
      - name: Check native launchers, hook commands and set activation failures
        run: |
          python3 tests/windows-commands.test.py
          python3 tests/sets.test.py SetsTests.test_windows_link_failure_does_not_activate_use_or_suggest SetsTests.test_windows_link_failure_preserves_existing_selection_and_sync_can_recover SetsTests.test_other_link_errors_do_not_suggest_changing_windows_privileges
      - name: Install, doctor, commit through hooks, guard and uninstall
        run: tests/smoke.test.sh

  mods:
    # The engine itself loads the mods, so its validator and test runner are the check that matters:
    # a mod that passes the Node unit tests can still be refused at load (usage-band was, from 0.4.2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Unit-test the mods with Node
        run: tests/mods-unit.sh
      - name: Install the pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - name: Validate and test the mods with the Claude Code CLI
        run: |
          claude --version
          claude plugin validate plugins
          for mod in plugins/*/; do
            claude plugin validate "$mod"
            claude plugin test "$mod"
          done
