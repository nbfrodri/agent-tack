name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -x install.sh uninstall.sh bin/tack bin/harness lib/*.sh tests/*.sh evals/run.sh git-hooks/_chain git-hooks/commit-msg git-hooks/pre-push git-hooks/pre-commit hooks/claude/*.sh hooks/claude/lib/*.sh
      - name: Validate skills, agents, cross-references and plugins.txt
        run: tests/validate.sh
      - name: Test the validator
        run: tests/validate.test.sh

  install:
    # macOS ships bash 3.2, so this also guards against newer bash-only syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Test install.sh in throwaway HOME directories
        run: tests/install.test.sh
      - name: Test git and Claude Code hooks
        run: tests/hooks.test.sh
      - name: Test audit regressions and startup context offline
        run: |
          tests/lifecycle.test.sh
          tests/doctor.test.sh
          tests/tools.test.sh
          tests/mods.test.sh
          tests/vscode.test.sh
          tests/codex.test.sh
          tests/cli.test.sh
          tests/settings.test.sh
          tests/safety.test.sh
          tests/guard.test.sh
          tests/evals.test.sh

  mods:
    # claude plugin validate/test need the Claude Code CLI; the job skips itself when it is not available
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate and test the mods
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "claude CLI not available; skipping mod validation"
            exit 0
          fi
          claude plugin validate plugins
          for mod in plugins/*/; do
            claude plugin validate "$mod"
            claude plugin test "$mod"
          done
