name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -x install.sh bin/harness lib/*.sh tests/*.sh evals/run.sh git-hooks/_chain git-hooks/commit-msg git-hooks/pre-push git-hooks/pre-commit hooks/claude/*.sh hooks/claude/lib/*.sh
      - name: Validate skills, agents, cross-references and plugins.txt
        run: tests/validate.sh
      - name: Test the validator
        run: tests/validate.test.sh

  install:
    # macOS ships bash 3.2, so this also guards against newer bash-only syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Test install.sh in throwaway HOME directories
        run: tests/install.test.sh
      - name: Test git and Claude Code hooks
        run: tests/hooks.test.sh
      - name: Test audit regressions and startup context offline
        run: |
          tests/cli.test.sh
          tests/settings.test.sh
          tests/safety.test.sh
          tests/guard.test.sh
          tests/evals.test.sh
